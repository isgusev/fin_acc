name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fin_acc
          POSTGRES_PASSWORD: fin_acc
          POSTGRES_DB: fin_acc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fin_acc"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://fin_acc:fin_acc@localhost:5432/fin_acc_test
      DATABASE_URL: postgresql+psycopg://fin_acc:fin_acc@localhost:5432/fin_acc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing
